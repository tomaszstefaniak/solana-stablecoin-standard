name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────
  # Rust / Anchor checks
  # ─────────────────────────────────────────
  rust:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace

      - name: cargo clippy (warnings are informational)
        run: cargo clippy --workspace -- -W clippy::all
        continue-on-error: true

      - name: cargo audit (informational)
        run: |
          cargo install cargo-audit --quiet 2>/dev/null || true
          cargo audit || true
        continue-on-error: true

  # ─────────────────────────────────────────
  # TypeScript SDK
  # ─────────────────────────────────────────
  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci

      - name: TypeScript check (tsc --noEmit)
        working-directory: sdk
        run: npx tsc --noEmit

      - name: Build SDK
        working-directory: sdk
        run: npm run build

      - name: Run SDK tests (unit only)
        working-directory: sdk
        run: npm test

  # ─────────────────────────────────────────
  # CLI
  # ─────────────────────────────────────────
  cli:
    name: TypeScript CLI
    runs-on: ubuntu-latest
    needs: sdk

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install SDK (for local file: dep)
        working-directory: sdk
        run: npm ci && npm run build

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: TypeScript check (tsc --noEmit)
        working-directory: cli
        run: npx tsc --noEmit

      - name: Build CLI
        working-directory: cli
        run: npm run build

  # ─────────────────────────────────────────
  # Backend
  # ─────────────────────────────────────────
  backend:
    name: Backend Services
    runs-on: ubuntu-latest
    needs: sdk

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install SDK (for local file: dep)
        working-directory: sdk
        run: npm ci && npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: TypeScript check (tsc --noEmit)
        working-directory: backend
        run: npx tsc --noEmit

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Run backend tests (unit only)
        working-directory: backend
        run: npm test
