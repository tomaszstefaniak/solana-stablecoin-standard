[workspace]
members = [
    "programs/sss-token",
    "programs/transfer-hook",
]
resolver = "2"

[workspace.dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022", "token_2022_extensions", "metadata"] }
spl-token-2022 = { version = "3", features = ["no-entrypoint"] }
spl-token-metadata-interface = { version = "0.3.3" }

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1

[profile.dev]
overflow-checks = true
