[package]
name = "sss-token"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sss_token"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
spl-token-2022 = { workspace = true }
spl-token-metadata-interface = { workspace = true }
# Pin zk-token-sdk to 1.x to prevent spl-pod 0.2.3 from pulling in
# solana-program 2.0.25, which causes type conflicts with spl-type-length-value.
solana-zk-token-sdk = "=1.18.26"
